# Production stack. Caddy terminates TLS, nginx serves the compiled application
# and proxies to Fastify, PostgreSQL persists everything.
#
# Exactly one server may run: it takes a PostgreSQL advisory lock on becoming
# ready, and a second instance exits rather than serving the same boards. Never
# raise the replica count, and never start a replacement before the old
# container has stopped.
services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chalkboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-chalkboard}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-chalkboard} -d ${POSTGRES_DB:-chalkboard}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs to completion before the server starts. Reads only DATABASE_URL, so no
  # public origin or sender identity is handed to a job that cannot use them.
  migrate:
    image: chalkboard-server:${CHALKBOARD_VERSION:-0.1.0}
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: chalkboard-server:${CHALKBOARD_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      # Verification codes go through the SES API. No key or secret appears
      # here: the client reads the instance role from the metadata service.
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
      CHALKBOARD_COMMIT: ${CHALKBOARD_COMMIT:?set CHALKBOARD_COMMIT}
      CHALKBOARD_VERSION: ${CHALKBOARD_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PORT: '3000'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-30000}
      # Caddy, then nginx. Two proxies stand between the browser and Fastify,
      # and this is what decides which address rate limiting believes.
      TRUST_PROXY_HOPS: '2'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # Must exceed SHUTDOWN_TIMEOUT_MS. The process force-exits at that deadline,
    # so a shorter external kill can cut short the final Yjs compaction.
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then((response) => { process.exit(response.ok ? 0 : 1); }).catch(() => { process.exit(1); })",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: chalkboard-web:${CHALKBOARD_VERSION:-0.1.0}
    restart: unless-stopped
    # nginx resolves `server` once when it loads its configuration and exits if
    # the name is missing, so it must not start before the server answers.
    depends_on:
      server:
        condition: service_healthy

  # Logical backups of every board, account, and uploaded image. Uses the same
  # pinned PostgreSQL image as the database, so it introduces no new artifact.
  #
  # Dumps land on the same volume as the data they protect, which covers
  # deletion, corruption, and a bad migration but not the loss of the disk.
  # EBS snapshots cover that; the two are not interchangeable.
  backup:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    command: ['/bin/sh', '/usr/local/bin/backup.sh']
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      # The public hostname. Port 80 must stay reachable: Let's Encrypt uses it
      # for issuance and for every renewal.
      CHALKBOARD_SITE_ADDRESS: ${CHALKBOARD_SITE_ADDRESS:?set CHALKBOARD_SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  caddy-config:
  caddy-data:
  postgres-backups:
  postgres-data:
