name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm playwright install --with-deps chromium firefox
      - run: pnpm test:e2e

  cloud-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: chalkboard_cloud_e2e
          POSTGRES_PASSWORD: chalkboard
          POSTGRES_USER: chalkboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chalkboard -d chalkboard_cloud_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://chalkboard:chalkboard@127.0.0.1:5432/chalkboard_cloud_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm playwright install --with-deps chromium
      - run: pnpm test:e2e:cloud

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: chalkboard_test
          POSTGRES_PASSWORD: chalkboard
          POSTGRES_USER: chalkboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chalkboard -d chalkboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://chalkboard:chalkboard@127.0.0.1:5432/chalkboard_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # Boots the production image so a change that breaks the deployable artifact —
  # an unbundled workspace import, a missing runtime file, a startup dependency
  # that is not actually optional — fails here rather than on a deploy.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: chalkboard_image
          POSTGRES_PASSWORD: chalkboard
          POSTGRES_USER: chalkboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chalkboard -d chalkboard_image"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chalkboard:chalkboard@127.0.0.1:5432/chalkboard_image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        run: |
          docker build -f apps/server/Dockerfile \
            --build-arg VCS_REF="${{ github.sha }}" \
            -t chalkboard-server:ci .
      - name: Apply migrations with only DATABASE_URL
        run: |
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            chalkboard-server:ci node dist/migrate.js
      - name: Start the server
        run: |
          docker run -d --name chalkboard-ci --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PORT=3000 \
            -e PUBLIC_ORIGIN=http://127.0.0.1:3000 \
            -e AWS_REGION=us-east-1 \
            -e EMAIL_FROM=accounts@example.com \
            chalkboard-server:ci
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health/ready | grep -q '"status":"ready"'; then
              echo "Server reported ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server never became ready"
          docker logs chalkboard-ci
          exit 1
      - name: Refuse a second instance
        run: |
          # The runtime advisory lock is what makes in-process room ownership and
          # rate-limit counters correct; prove it still rejects a second server.
          # A distinct port keeps a port clash from passing this for the wrong
          # reason, and the message is asserted rather than just the exit code.
          if docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PORT=3001 \
            -e PUBLIC_ORIGIN=http://127.0.0.1:3001 \
            -e AWS_REGION=us-east-1 \
            -e EMAIL_FROM=accounts@example.com \
            chalkboard-server:ci >second-instance.log 2>&1; then
            echo "A second instance started while the runtime lock was held"
            cat second-instance.log
            exit 1
          fi
          if ! grep -q "holds the production runtime lock" second-instance.log; then
            echo "The second instance failed for some other reason:"
            cat second-instance.log
            exit 1
          fi
      - name: Show server logs
        if: always()
        run: docker logs chalkboard-ci || true
      - name: Stop the server
        if: always()
        run: docker rm -f chalkboard-ci || true
